name: Atualizar rastreio Melhor Envio

# A cada 30 minutos o site confere no Melhor Envio se algum pacote foi
# postado/entregue e atualiza o pedido (e manda o e-mail pro cliente).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 https://www.heartscouro.com.br/api/rastreio/sincronizar
